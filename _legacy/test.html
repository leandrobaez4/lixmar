<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>LIXMAR - Demo Mobile</title>
	<link rel="stylesheet" href="styles/main.css">
</head>
<body>
	<!-- Header móvil -->
	<header class="header">
		<div class="header-promo">
			<span class="promo-label">¡Envíos gratis a todo el país!</span>
			<span class="promo-phone">Atención: 0800-123-4567</span>
		</div>
		<div class="header-container">
			<div class="logo">
				<span class="logo-icon">🧼</span>
				<span class="logo-text">LIXMAR</span>
			</div>
			<button class="mobile-menu-toggle" aria-label="Abrir menú">
				<span></span>
				<span></span>
				<span></span>
			</button>
		</div>
	</header>

	<!-- Contenido principal -->
	<main class="container" style="padding-top: 32px;">
		<section style="text-align:center; margin-top:40px;">
			<img src="img/demo-mobile.png" alt="Demo Mobile LIXMAR" style="max-width: 220px; width: 100%; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); margin-bottom: 24px;">
			<h1 style="font-size: 2rem; color: #ff6b35; margin-bottom: 12px;">¡Bienvenido a LIXMAR!</h1>
			<p style="font-size: 1.1rem; color: #555; margin-bottom: 24px;">Descubre nuestros productos de limpieza y aprovecha las mejores ofertas para tu hogar.</p>
			<a href="products.html" class="nav-link" style="background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%); color: #fff; padding: 12px 32px; border-radius: 24px; font-size: 1rem; font-weight: bold; text-decoration: none; box-shadow: 0 2px 8px rgba(255,107,53,0.08);">Ver productos</a>
		</section>
	</main>

	<script src="src/main.js"></script>
</body>
</html>
